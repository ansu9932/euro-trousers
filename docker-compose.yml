services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customs-local}
      POSTGRES_DB: ${POSTGRES_DB:-customsdb}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, pg_isready -U customs -d customsdb], interval: 10s, timeout: 5s, retries: 5 }
    networks: [customs]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-customs-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-customs-minio-local}
    volumes: [minio_data:/data]
    healthcheck: { test: [CMD, mc, ready, local], interval: 10s, timeout: 5s, retries: 5 }
    networks: [customs]
  api:
    build: { context: ./backend }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [customs]
  caddy:
    image: caddy:2-alpine
    ports: [80:80, 443:443]
    environment: { CUSTOM_DOMAIN: '${CUSTOM_DOMAIN:-localhost}' }
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    depends_on: [api]
    networks: [customs]
networks: { customs: {} }
volumes: { postgres_data: {}, minio_data: {}, caddy_data: {}, caddy_config: {} }
